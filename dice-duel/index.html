<link rel="manifest" href="manifest.webmanifest" />
<title>Dice Duel</title>
<style>
:root{
  --bg:#eef4ea; --surface:#fffdf7; --ink:#1c2b1e; --muted:#6d7f6a;
  --line:#d9e2cf; --accent:#175c3d; --gold:#c9932b;
  --shadow:0 10px 30px rgba(23,62,40,.12);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;}
.page{max-width:560px;margin:0 auto;padding:clamp(20px,5vw,40px) clamp(16px,4vw,28px) 48px;}
header h1{font-size:30px;margin:0;letter-spacing:-.03em;}
header h1 span{color:var(--accent);}
header p{color:var(--muted);font-size:14.5px;line-height:1.55;margin:8px 0 0;max-width:44ch;}
.arena{margin-top:24px;display:flex;gap:14px;justify-content:center;}
.player{flex:1;max-width:200px;background:var(--surface);border:1px solid var(--line);
  border-radius:20px;padding:16px 12px 14px;text-align:center;box-shadow:var(--shadow);}
.player .who{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.die{width:104px;height:104px;margin:12px auto 10px;background:#fffdf7;
  border:1px solid var(--line);border-radius:22px;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  padding:17px;box-shadow:inset 0 -6px 14px rgba(23,62,40,.08);}
.die .pip{width:72%;height:72%;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden;}
.die .pip.on{visibility:visible;}
.die.cpu{background:#22301f;border-color:#22301f;}
.die.cpu .pip{background:#f3ecd9;}
.die.win{outline:3px solid var(--gold);outline-offset:2px;}
.die.tumbling{animation:tumble .18s linear infinite;}
@keyframes tumble{
  0%{transform:rotate(0deg) translateY(0)}
  25%{transform:rotate(6deg) translateY(-4px)}
  50%{transform:rotate(-5deg) translateY(0)}
  75%{transform:rotate(3deg) translateY(-2px)}
  100%{transform:rotate(0deg) translateY(0)}
}
.dots{display:flex;gap:6px;justify-content:center;min-height:10px;}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);}
.dots i.filled{background:var(--accent);}
.player.cpu-side .dots i.filled{background:var(--ink);}
.message{margin:22px auto 0;max-width:44ch;text-align:center;font-size:16px;line-height:1.5;min-height:48px;}
.message strong{color:var(--accent);}
button.roll{margin:14px auto 0;display:block;width:100%;max-width:320px;
  padding:15px 20px;font-size:17px;font-weight:700;letter-spacing:.01em;
  color:#fff;background:var(--accent);border:none;border-radius:16px;cursor:pointer;
  box-shadow:var(--shadow);-webkit-tap-highlight-color:transparent;}
button.roll:active{transform:scale(.99);}
button.roll:disabled{opacity:.55;}
.history{margin:20px auto 0;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:24px;}
.history span{font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);}
.history span.w{color:var(--accent);border-color:var(--accent);}
.history span.l{color:#a33c2a;border-color:#a33c2a;}
footer{margin-top:30px;text-align:center;color:var(--muted);font-size:12px;}
footer a{color:var(--accent);}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Dice <span>Duel</span></h1>
    <p>You against the computer. Higher die takes the round — first to five rounds wins the match. Dead heats score nothing.</p>
  </header>

  <div class="arena">
    <div class="player">
      <div class="who">You</div>
      <div class="die" id="dieYou" aria-label="Your die"></div>
      <div class="dots" id="dotsYou"></div>
    </div>
    <div class="player cpu-side">
      <div class="who">Computer</div>
      <div class="die cpu" id="dieCpu" aria-label="Computer die"></div>
      <div class="dots" id="dotsCpu"></div>
    </div>
  </div>

  <p class="message" id="message" aria-live="polite">Tap roll to throw the first round.</p>
  <button class="roll" id="rollBtn" type="button">Roll</button>
  <div class="history" id="history"></div>

  <footer>
    <div>v1.0 · build 2026-11-25 16:36 GMT</div>
    <div>Part of the <a href="../">jw-spa</a> collection.</div>
  </footer>
</div>
<script>
(function(){
  "use strict";
  var PIPS = {1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8]};
  var TARGET = 5;
  var dieYou = document.getElementById("dieYou");
  var dieCpu = document.getElementById("dieCpu");
  var dotsYou = document.getElementById("dotsYou");
  var dotsCpu = document.getElementById("dotsCpu");
  var message = document.getElementById("message");
  var history = document.getElementById("history");
  var btn = document.getElementById("rollBtn");
  var you = 0, cpu = 0, streak = 0, rolling = false, over = false;

  function renderDie(el, n){
    el.innerHTML = "";
    for (var i = 0; i < 9; i++){
      var s = document.createElement("span");
      s.className = "pip" + (PIPS[n].indexOf(i) >= 0 ? " on" : "");
      el.appendChild(s);
    }
  }
  function renderDots(){
    [ [dotsYou, you], [dotsCpu, cpu] ].forEach(function(pair){
      pair[0].innerHTML = "";
      for (var i = 0; i < TARGET; i++){
        var d = document.createElement("i");
        if (i < pair[1]) d.className = "filled";
        pair[0].appendChild(d);
      }
    });
  }
  function addHistory(cls, label){
    var s = document.createElement("span");
    s.className = cls;
    s.textContent = label;
    history.appendChild(s);
  }
  function reset(){
    you = 0; cpu = 0; streak = 0; over = false;
    history.innerHTML = "";
    dieYou.classList.remove("win"); dieCpu.classList.remove("win");
    renderDie(dieYou, 5); renderDie(dieCpu, 3); renderDots();
    message.textContent = "Fresh match. Tap roll to throw the first round.";
    btn.textContent = "Roll";
  }
  function settle(a, b){
    rolling = false;
    btn.disabled = false;
    dieYou.classList.remove("tumbling"); dieCpu.classList.remove("tumbling");
    renderDie(dieYou, a); renderDie(dieCpu, b);
    dieYou.classList.toggle("win", a > b);
    dieCpu.classList.toggle("win", b > a);
    if (a > b){
      you++; streak = streak > 0 ? streak + 1 : 1;
      addHistory("w", a + "–" + b + " you");
      message.innerHTML = "<strong>You take the round,</strong> " + a + " to " + b + "." +
        (streak >= 3 ? " That's " + streak + " in a row — you're on fire." : "");
    } else if (b > a){
      cpu++; streak = streak < 0 ? streak - 1 : -1;
      addHistory("l", a + "–" + b + " cpu");
      message.innerHTML = "<strong>Computer takes it,</strong> " + b + " to " + a + "." +
        (streak <= -3 ? " The dice have turned against you." : "");
    } else {
      streak = 0;
      addHistory("", a + "–" + b + " draw");
      message.textContent = "Dead heat at " + a + " — no points, roll again.";
    }
    renderDots();
    if (you >= TARGET || cpu >= TARGET){
      over = true;
      btn.textContent = "Play again";
      message.innerHTML = you >= TARGET
        ? "<strong>You win the match " + you + "–" + cpu + ".</strong> Champion of the front room."
        : "<strong>Computer wins the match " + cpu + "–" + you + ".</strong> The dice demand a rematch.";
    }
  }
  btn.addEventListener("click", function(){
    if (rolling) return;
    if (over){ reset(); return; }
    rolling = true;
    btn.disabled = true;
    btn.textContent = "Rolling…";
    dieYou.classList.remove("win"); dieCpu.classList.remove("win");
    dieYou.classList.add("tumbling"); dieCpu.classList.add("tumbling");
    var a = 1 + Math.floor(Math.random() * 6);
    var b = 1 + Math.floor(Math.random() * 6);
    var ticks = 0;
    var iv = setInterval(function(){
      renderDie(dieYou, 1 + Math.floor(Math.random() * 6));
      renderDie(dieCpu, 1 + Math.floor(Math.random() * 6));
      if (++ticks >= 9){ clearInterval(iv); settle(a, b); }
    }, 65);
  });
  renderDie(dieYou, 5); renderDie(dieCpu, 3); renderDots();
})();
</script>
</body>
</html>
